name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci-release.txt
      - name: Validate release contract tests
        run: >
          pytest -q
          tests/test_release_gate.py
          tests/test_release_soak.py
          tests/test_v1_release_gate.py
          tests/test_phase4_operational_cycle.py
          tests/test_operational_readiness.py
      - uses:  messense/maturin-action@v1
        with:
          command: publish
          args: --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}
