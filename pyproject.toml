# Directory path: pyproject.toml
# Title: Project configuration
# Purpose: Package metadata, CLI commands, dependencies, mypy settings, and Rust integration.

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sara_engine"
version = "1.1.0"
description = "A CPU-first bio-inspired Spiking Neural Network engine with bounded-state CLI, evaluation, and release validation flows."
authors = [
    { name = "matsushibadenki", email = "apple.darwin@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["snn", "spiking-neural-network", "cpu-only", "neuromorphic", "backprop-free", "agent"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "transformers",
    "msgpack",
    "numpy",
    "torch",
    "tqdm"
]

[project.urls]
Homepage = "https://github.com/matsushibadenki/sara-engine-project"
Repository = "https://github.com/matsushibadenki/sara-engine-project"
Documentation = "https://github.com/matsushibadenki/sara-engine-project/tree/main/doc"
Issues = "https://github.com/matsushibadenki/sara-engine-project/issues"

[project.scripts]
sara-chat = "sara_engine.cli:chat"
sara-train = "sara_engine.cli:train"

[tool.maturin]
python-source = "src"
module-name = "sara_engine.sara_rust_core"
features = ["extension-module"]

[tool.pytest.ini_options]
# Exclude legacy tests under scripts/old from collection.
addopts = "--ignore=scripts/old"

[tool.mypy]
# Use src as the only module search root.
mypy_path = "src"
# Check the package by explicit package name.
packages = ["sara_engine"]

# Prevent duplicate module resolution.
explicit_package_bases = false
namespace_packages = false

# Base settings.
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sara_engine.*"
ignore_missing_imports = true
